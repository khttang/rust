[package]
name = "firmware"
version = "0.1.0"
authors = ["ktang <khttang@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "firmware"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
anyhow = "1.0.103"
log = "0.4"
esp_idf_logger = "0.1.1"
embedded-svc = "0.29.0"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Required to access raw FFI camera bindings generated by the C compilation phase
esp-idf-sys = { version = "0.37.2", features = ["native"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
edge-executor = "0.4"
async-channel = "2.3"
futures = "0.3"
tokio = { version = "1.52.3", features = ["time"] }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
# Explicitly force esp-idf-sys to map and merge through your local defaults file!
sdkconfig_defaults = ["sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["esp32-camera"]
bindings_header = "bindings.h"
bindings_module = "camera" # Re-isolated to shield the HAL