# OpenShell sandbox policy for agent-harness.
#
# Schema: NVIDIA OpenShell v0.0.116 policy reference. Loaded and enforced by
# OpenShell 0.1.2 (docker driver, colima) on 2026-09-30; validate-openshell.sh
# re-runs those checks.
# Rationale and review notes: docs/security-architecture.md.
#
# Assumes the release binaries are installed at /app/agent-harness and
# /app/verified-fix (the verified-fix task, which runs cbmc and gcc from /usr).
# Credentials: attach OpenShell `anthropic` / `openai` providers to the sandbox
# so the agent only sees placeholders; never put real keys in this file.
# Gemini needs a custom provider for that (see docs/security-architecture.md).
# Ollama: run with OLLAMA_API_BASE_URL=http://host.openshell.internal:11434

version: 1

# Static: locked at sandbox creation.
filesystem_policy:
  include_workdir: false
  read_only:
    - /app/agent-harness   # the executables, not src/
    - /app/verified-fix
    - /app/corpus          # the verified-fix corpus
    - /usr
    - /lib
    - /etc                 # CA bundle for TLS, resolv.conf
  read_write:
    - /tmp
    # - /app/secure_vault  # only once a persistence layer exists

# Static: never run with a filesystem gap.
landlock:
  compatibility: hard_requirement

# Static: never root.
process:
  run_as_user: sandbox
  run_as_group: sandbox

# Dynamic: hot-reloadable with `openshell policy update` / `set`.
# Each endpoint allows only the single request rig 0.43 makes.
network_policies:
  anthropic:
    name: anthropic-api
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /v1/messages }
    binaries:
      - path: /app/agent-harness
      - path: /app/verified-fix

  openai:
    name: openai-api
    endpoints:
      - host: api.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /v1/responses }
    binaries:
      - path: /app/agent-harness
      - path: /app/verified-fix

  # Google AI Studio (GEMINI_API_KEY, sent by rig in an x-goog-api-key
  # header). OpenShell has no built-in provider type for it, so without a
  # custom provider bound here the real key must be passed into the sandbox.
  gemini:
    name: gemini-api
    endpoints:
      - host: generativelanguage.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1beta/models/*:generateContent" }
    binaries:
      - path: /app/agent-harness
      - path: /app/verified-fix

  ollama:
    name: ollama-host
    endpoints:
      - host: host.openshell.internal
        port: 11434
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /api/chat }
    binaries:
      - path: /app/agent-harness
      - path: /app/verified-fix
