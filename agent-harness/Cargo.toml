# The agent-harness workspace.
#
# The core crate lives at the workspace root (src/, tests/). Tool families
# (agent-harness-tools-*) and tasks (agent-harness-task-*) go in crates/.
# Shared versions are pinned once in [workspace.dependencies]: every crate
# must use the same rig-core, because tools written with #[rig_tool] resolve
# rig-core from their own Cargo.toml and exchange rig types with the core.

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/khttang/rust"

[workspace.dependencies]
agent-harness = { path = "." }
anyhow = "1.0.104"
rig-core = { version = "0.43", features = ["reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }

[package]
name = "agent-harness"
description = "A generic, trait-driven agent harness built on rig-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "agent_harness"
path = "src/lib.rs"

[[bin]]
name = "agent-harness"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
rig-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
