[package]
name = "psupervisor"
version = "0.1.0"
edition = "2024"

[dependencies]
# Tokio async runtime with macros and networking features enabled
tokio = { version = "1.0", features = ["full"] }

# Nix provides safe bindings to POSIX/Unix systems APIs
nix = { version = "0.29", features = ["process", "signal"] }